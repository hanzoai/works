name: CI/CD

# The gate for hanzo.works, on the native runners (git.hanzo.ai → git-runner).
# The ~7-line caller shape: triggers plus the import. All real config lives in
# the repo-root hanzo.yml, which platform.hanzo.ai reads too.
#
# It is `.hanzo/workflows` and NOT `.github/workflows`, and that is not a
# preference. The forge collects workflows from the FIRST of WORKFLOW_DIRS that
# exists in the pushed commit and ignores the rest, so once this directory
# exists a `.github/workflows` beside it is dark config. And the runner label
# below is advertised only by runners registered to git.hanzo.ai — a job asking
# for it on github.com is never assigned and sits until the 24h timeout rather
# than failing, which is the worst kind of red.
#
# No `runner:` input: hanzoai/ci defaults to ["hanzo-build-linux-amd64"], which
# the git-runners actually advertise. No `permissions:` block: that existed to
# satisfy GitHub's compile-time check on reusable calls, and the reusable
# carries its own on this forge.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
